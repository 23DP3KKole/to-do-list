<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <title>To Do list</title>
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h2>To-Do list <img src="/public/img/todo.webp" alt=""></h2>
            <div class="row">
                <input type="text" id="input-box" placeholder="Add your text" action="/tasks" method="post">
                <button id="add-button" onclick="addTask()">Add</button>
            </div>
            <ul id="list-container">
            </ul>
        </div>
    </div>
    <script src="/public/js/main.js"></script>
</body>
</html>
