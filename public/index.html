<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>To-Do Lists</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
<div class="container">
    <div class="todo-app">
        <h1>My To-Do List</h1>
        <form id="taskForm" class="">
            <input type="text" id="title" placeholder="Task title" required />
            <input id="description" placeholder="Task description">
            <button id="add-button" type="submit">Add task</button>
        </form>
        <div id="tasks"></div>
    </div>
</div>

  <script src="main.js"></script>
</body>
</html>
